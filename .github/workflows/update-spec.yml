name: Track upstream Supersonic releases
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Bump Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          TAG=$(curl -fsSL https://api.github.com/repos/supersonic-app/supersonic/releases/latest | jq -r .tag_name)
          VER=${TAG#v}
          CUR=$(grep -m1 '^Version:' supersonic.spec | awk '{print $2}')
          REPO="${{ github.repository }}"

          if gh release view v$VER --repo $REPO --json assets -q '.assets[].name' 2>/dev/null | grep -q "supersonic-$VER.tar.gz"; then
            [ "$VER" = "$CUR" ] && { echo "Everything is up to date"; exit 0; }
          fi

          if [ -n "$CUR" ] && [ "$VER" != "$CUR" ]; then
            echo "Removing old version (v$CUR) release and tag..."
            gh release delete v$CUR --repo $REPO --yes || true
            git push origin :refs/tags/v$CUR || true
          fi

          echo "Downloading source code and adding vendor..."
          curl -sL https://github.com/supersonic-app/supersonic/archive/refs/tags/$TAG.tar.gz | tar xz
          cd supersonic-$VER
          go mod vendor
          cd ..
          
          tar czf supersonic-$VER.tar.gz supersonic-$VER

          NEEDS_COMMIT=false
          if [ "$VER" != "$CUR" ]; then
            sed -i -E "s/^(Version:[[:space:]]+).*/\1$VER/" supersonic.spec
            sed -i -E "s/^(Release:[[:space:]]+).*/\11%{?dist}/" supersonic.spec
            DATE=$(LC_ALL=C date "+%a %b %d %Y")
            sed -i "/^%changelog/a * $DATE coffeeicus <coffeelover@coffeelover.uk> - $VER-1\n- Update to $VER" supersonic.spec
            NEEDS_COMMIT=true
          fi

          SOURCE0="https://github.com/$REPO/releases/download/v$VER/supersonic-$VER.tar.gz"
          if ! grep -q "^Source0:.*$SOURCE0" supersonic.spec; then
            sed -i -E "s|^(Source0:[[:space:]]+).*|\1$SOURCE0|" supersonic.spec
            NEEDS_COMMIT=true
          fi

          if [ "$NEEDS_COMMIT" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Bump/Update Supersonic to v$VER"
            git push
          fi
          SHA=$(git rev-parse HEAD)

          gh release create v$VER supersonic-$VER.tar.gz \
              --repo $REPO --target "$SHA" \
              --notes "Auto-generated source with vendor for $VER" || \
          gh release upload v$VER supersonic-$VER.tar.gz --repo $REPO --clobber

          if [ -n "$CUR" ] && [ "$VER" != "$CUR" ]; then
            gh release delete v$CUR --repo $REPO --yes || true
            git push origin :refs/tags/v$CUR || true
          fi

          gh release create v$VER supersonic-$VER.tar.gz --repo $REPO --notes "Auto-generated source with vendor for $VER" || \
          gh release upload v$VER supersonic-$VER.tar.gz --repo $REPO --clobber
