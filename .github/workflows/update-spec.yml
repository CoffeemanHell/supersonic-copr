name: Track upstream Supersonic releases
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Bump Version & Vendor
        run: |
          set -e
          TAG=$(curl -fsSL https://api.github.com/repos/supersonic-app/supersonic/releases/latest | jq -r .tag_name)
          VER=${TAG#v}
          CUR=$(grep -m1 '^Version:' supersonic.spec | awk '{print $2}')

          [ "$VER" = "$CUR" ] && exit 0

          curl -sL https://github.com/supersonic-app/supersonic/archive/refs/tags/$TAG.tar.gz | tar xz
          cd supersonic-$VER && go mod vendor && tar czf ../vendor.tar.gz vendor && cd ..

          sed -i -E "s/^(Version:[[:space:]]+).*/\1$VER/" supersonic.spec
          sed -i -E "s/^(Release:[[:space:]]+).*/\11%{?dist}/" supersonic.spec
          sed -i -E "s|^(Source1:[[:space:]]+).*|\1https://github.com/${{ github.repository }}/releases/download/v$VER/vendor.tar.gz|" supersonic.spec

          DATE=$(LC_ALL=C date "+%a %b %d %Y")
          sed -i "/^%changelog/a * $DATE coffeeicus <coffeelover@coffeelover.uk> - $VER-1\n- Update to $VER" supersonic.spec

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump Supersonic to v$VER"
          git tag v$VER
          git push --follow-tags

          gh release create v$VER vendor.tar.gz --notes "Auto-generated vendor for $VER"
        env:
          GH_TOKEN: ${{ github.token }}
