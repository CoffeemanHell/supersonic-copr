name: Track upstream Supersonic releases
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Bump Version in spec
        run: |
          TAG=$(curl -fsSL https://api.github.com/repos/dweymouth/supersonic/releases/latest | jq -r .tag_name)
          echo "$TAG" | grep -qE '^v[0-9]+(\.[0-9]+)+$' || { echo "::error::Bad tag_name: '$TAG'" >&2; exit 1; }
          VER=${TAG#v}
          CUR=$(grep -m1 '^Version:' supersonic.spec | grep -oE '[0-9]+(\.[0-9]+)+')
          [ "$VER" = "$CUR" ] && exit 0
          sed -i -E "s/^(Version:[[:space:]]+).*/\1$VER/" supersonic.spec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supersonic.spec
          git commit -m "Bump Supersonic to v$VER"
          git push
